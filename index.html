<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>McDonald’s Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="chat">
  <header>
    <div class="logo" aria-hidden="true">M</div>
    <div><h1>McDonald’s Chat</h1><p>Ask about our menu, deals and hours</p></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="in" autocomplete="off" placeholder="Type “hai” to start…" aria-label="Your message">
    <button class="send" type="submit">Send</button>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
